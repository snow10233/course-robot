name: course-robot

services:
  worker:
    image: course-robot:local
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    env_file:
      - .env
    environment:
      COURSE_ROBOT_REPORTS_ENABLED: "false"
      GOOGLE_CALENDAR_ENABLED: "true"
      HEALTHCHECK_MAX_AGE_SECONDS: "${HEALTHCHECK_MAX_AGE_SECONDS:-3600}"
      SYNC_INTERVAL_SECONDS: "${SYNC_INTERVAL_SECONDS:-900}"
      TZ: Asia/Taipei
    volumes:
      - type: bind
        source: ./data
        target: /app/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-m", "course_robot.healthcheck"]
      interval: 5m
      timeout: 15s
      retries: 3
      start_period: 2m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    stop_grace_period: 45s
